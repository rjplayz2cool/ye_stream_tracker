<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ye Crossword</title>
<style>body{background:radial-gradient(at top left,#37233c,#101019 65%);color:#eee;font:16px system-ui;margin:0}main{max-width:1050px;margin:auto;padding:12px}h1{font-size:27px;margin:5px 0}section{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}.panel{background:#22222c;border:1px solid #ffffff22;border-radius:16px;padding:16px}#board{display:grid;gap:1px;margin:10px auto;width:max-content;max-width:100%;height:auto;max-height:none;aspect-ratio:auto;align-content:start;justify-content:start}.sq{position:relative;aspect-ratio:1;overflow:hidden;min-width:0;min-height:0;background:white;color:#111}.sq.empty{background:#14141b}.sq input{display:block;line-height:1;box-sizing:border-box;min-width:0!important;min-height:0!important;max-width:100%;max-height:100%;background:none;border:0;border-radius:0;width:100%;height:100%;padding:0;text-align:center;font-weight:800;font-size:clamp(11px,1.3vw,16px);outline:0;text-transform:uppercase}.sq.active{background:#f5da96}.sq.current{background:#edb946}.sq small{position:absolute;left:2px;top:0;font-size:8px;pointer-events:none}.clue{display:block;width:100%;text-align:left;background:#ffffff0e;border:0;color:white;border-radius:8px;padding:6px;margin:3px 0;cursor:pointer}.clue.active{background:#a77932}button#check{background:#edc577;border:0;padding:13px 22px;border-radius:9px;font-weight:800;cursor:pointer}#status{color:#f3cf87}@media(max-width:800px){section{grid-template-columns:1fr}#board{max-width:min(100%,420px)}}@media(max-width:700px){section{grid-template-columns:1fr}#board{max-width:100%}}.clue{font-size:12px;padding:7px;margin:3px 0}h2{font-size:17px;margin:8px 0}h1{margin:5px 0;font-size:24px}main>p{font-size:12px;margin:5px 0 10px}.sq small{font-size:8px}body{scrollbar-color:#555568 #14141b;scrollbar-width:thin}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-track{background:#14141b;border-radius:10px}::-webkit-scrollbar-thumb{background:#555568;border:2px solid #14141b;border-radius:12px}::-webkit-scrollbar-thumb:hover{background:#8b83a0}</style>
<style>#now{display:block;margin:8px 0 2px;padding:9px 12px;border-radius:10px;background:#a7793233;border:1px solid #edb94655;color:#ffe3a6;font-size:13px;min-height:1.2em}.panel{min-width:0}#board{overflow:auto;-webkit-overflow-scrolling:touch}.sq{transition:background .12s}.sq input{font-size:var(--fs,16px)!important;caret-color:transparent;cursor:pointer;color:#111;-webkit-text-fill-color:#111}.sq.bad{background:#f2a1a1!important}.sq small{font-size:9px}.clue{transition:background .12s}#across,#down{max-height:260px;overflow:auto;position:relative}.clue:focus-visible,#check:focus-visible{outline:2px solid #edb946}@media(max-width:800px){#across,#down{max-height:180px}}html{scrollbar-gutter:stable}</style><main><h1>YE CROSSWORD</h1><p>Daily puzzle · Released Ye album tracks + Daily Roll Unreleased songs · 7–15 songs · 100 YZYMNY upon verified completion</p><section><div class="panel"><strong id="meta"></strong><div id="now"></div><div id="board"></div><p id="status"></p><button id="check">Check answers</button> <button id="redeem" style="display:none;background:#d5a654;border:0;border-radius:9px;padding:13px 22px;font-weight:800;cursor:pointer">Redeem 100 YZYMNY</button></div><aside class="panel"><h2>Across</h2><div id="across"></div><h2>Down</h2><div id="down"></div></aside></section></main>
<script>
const tracks=[
["GOOD MORNING","Opening track on Graduation."],["HEARTLESS","Third track on 808s & Heartbreak."],["GOOD LIFE","Graduation song featuring T-Pain."],["BOUND 2","Closing track on Yeezus."],["RUNAWAY","My Beautiful Dark Twisted Fantasy track featuring Pusha T."],["STRONGER","Graduation song sampling Daft Punk."],["HURRICANE","Donda song featuring The Weeknd and Lil Baby."],["CARNIVAL","VULTURES 1 hit featuring Rich The Kid and Playboi Carti."],
["GOOD DONT DIE","Was removed from Spotify in 2024 due to sample problems."],["FIELD TRIP","Was removed from Spotify for no apparent reason in 2024."],["CAN U BE","The holy grail of unreleased songs."],["BITTERSWEET POETRY","Japanese exclusive song following Graduation."],["SEE ME NOW","Deluxe track for My Beautiful Dark Twisted Fantasy, unavailable on most streaming services."],["PABLO","Now unavailable DONDA 2 track featuring Future and Travis Scott."],["MR MIYAGI","Now unavailable DONDA 2 track featuring Future and Playboi Carti."],["WE DID IT","A massive collaboration from DONDA 2, with features from the Migos, Baby Keem, and Fivio Foreign."],
["SHOWTIME","A track from WAR that was later reused for BULLY."],["MR YE AND JESUS","A very controversial song from his unreleased album CUCK."],["SOUTH CAROLINA","An early version of a released song from Donda with a sample from his mother."],["HAPPY","A massive grail from the community that only has a 12 second snippet from a 2023 era."],["PUSSY COST MONEY","A highly anticipated song from the VULTURES era, rumored to be released soon by Ty Dolla $ign."],["ALL IN LOVE","A song stretching from WAR to VULTURES, played by Ty Dolla $ign on a Twitch stream."],["LIVING SO ITALIAN","The community holy grail, was recently leaked during a groupbuy."],["NEW BODY","A track that has been reworked for almost every album since Yandhi, unleaked versions feature Ice Spice."],["WE ARE YOUNG","The original version to fun.'s song from Watch The Throne."],["EVERYBODY","Most famous unreleased VULTURES track, as it is played by Ye at all of his shows."],["CASH TO BURN","A song coming from Yandhi, was reworked on Jesus Is King but never released."],["PAY PER VIEW","A famous unreleased track from VULTURES, features Project Pat."],["MITUS TOUCH","Features Rihanna, has heavy production from The Life Of Pablo, is unreleased."],["MELROSE","Famous track from VULTURES, was reworked for a potential BULLY release, but was removed from any tracklists after a tweet from Ye saying he was happy it wasnt on BULLY."],["AFTER YOU","Unreleased track from Yeezus 2, some versions feature Lauryn Hill and John Legend."],["YE ABOUT MINE","Unreleased VULTURES 2 track, has features from Rich The Kid and Takeoff."],["SEE ME AGAIN","His most famous unreleased song, dating back to Good Ass Job."],["MAMAS BOYFRIEND","Samples Billy Joel, Yedit famous."],["FLASHING LIGHTS 2","A version of an already released track from Graduation that is allegedly just the live production."]
];
const normalize=s=>s.toUpperCase().replace(/[^A-Z0-9]/g,"");
const day=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
let seed=2166136261;for(const c of day+"ye-crossword")seed=Math.imul(seed^c.charCodeAt(0),16777619)>>>0;
function random(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
// Daily rotation uses stable independent released/unreleased queues. Each queue
// advances by the day's quota, so adjacent dates draw different songs rather
// than reshuffling the same small pool from scratch.
const unreleasedTitles=new Set([
 'CAN U BE','SHOWTIME','MR YE AND JESUS','SOUTH CAROLINA','HAPPY',
 'PUSSY COST MONEY','ALL IN LOVE','LIVING SO ITALIAN','NEW BODY',
 'WE ARE YOUNG','EVERYBODY','CASH TO BURN','PAY PER VIEW',
 'MITUS TOUCH','MELROSE','AFTER YOU','YE ABOUT MINE',
 'SEE ME AGAIN','MAMAS BOYFRIEND','FLASHING LIGHTS 2'
]);
const released=tracks.filter(t=>!unreleasedTitles.has(t[0]));
const unreleased=tracks.filter(t=>unreleasedTitles.has(t[0]));
const dayIndex=Math.floor((Date.UTC(...day.split('-').map((v,i)=>i===1?Number(v)-1:Number(v)))-Date.UTC(2026,0,1))/86400000);
function stableShuffle(items,salt){
 let state=2166136261;
 for(const c of salt)state=Math.imul(state^c.charCodeAt(0),16777619)>>>0;
 function next(){state^=state<<13;state^=state>>>17;state^=state<<5;return(state>>>0)/4294967296}
 return items.map((t,i)=>({t,i,k:next()})).sort((a,b)=>a.k-b.k||a.i-b.i).map(x=>x.t);
}
const releasedQueue=stableShuffle(released,'ye-crossword-released-v2');
const unreleasedQueue=stableShuffle(unreleased,'ye-crossword-unreleased-v2');
const goal=9+Math.floor(random()*4),N=45,g=Array.from({length:N},()=>Array(N).fill("")),words=[];
// Six released and four unreleased are prioritized daily. Placement may
// occasionally need extra candidates for intersections.
const pickQueue=(queue,offset)=>Array.from({length:queue.length},(_,i)=>queue[((offset%queue.length)+queue.length+i)%queue.length]);
const releasedChoices=pickQueue(releasedQueue,dayIndex*8);
const unreleasedChoices=pickQueue(unreleasedQueue,dayIndex*2);
const pool=[];
for(let i=0;i<Math.max(releasedChoices.length,unreleasedChoices.length);i++){
 if(i<releasedChoices.length)pool.push(releasedChoices[i]);
 if(i<unreleasedChoices.length)pool.push(unreleasedChoices[i]);
}
function valid(w,x,y,d){const dx=d==="Across"?1:0,dy=1-dx;if(x<1||y<1||x+dx*(w.length-1)>=N-1||y+dy*(w.length-1)>=N-1)return -1;let hits=0;for(let i=0;i<w.length;i++){const xx=x+dx*i,yy=y+dy*i,v=g[yy][xx];if(v&&v!==w[i])return -1;if(v)hits++;else if((d==="Across"&&(g[yy-1][xx]||g[yy+1][xx]))||(d==="Down"&&(g[yy][xx-1]||g[yy][xx+1])))return -1}if(g[y-dy][x-dx]||g[y+dy*w.length][x+dx*w.length])return -1;return hits}
function add(t,x,y,d){const w=normalize(t[0]);for(let i=0;i<w.length;i++)g[y+(d==="Down"?i:0)][x+(d==="Across"?i:0)]=w[i];words.push({t,w,x,y,d})}
// Prefer the intended 60/40 mix when choosing intersections. We use a
// larger reserve of unique tracks if a chosen word cannot fit on the grid.
const desiredUnreleased=Math.min(3,Math.max(2,Math.round(goal*.22)));
const desiredReleased=goal-desiredUnreleased;
let usedReleased=0,usedUnreleased=0;
function placeCandidate(t){
 const w=normalize(t[0]),choices=[];
 for(let i=0;i<w.length;i++)for(const p of words)for(let j=0;j<p.w.length;j++){
  if(w[i]!==p.w[j])continue;
  const d=p.d==="Across"?"Down":"Across";
  const x=p.x+(p.d==="Across"?j:0)-(d==="Across"?i:0);
  const y=p.y+(p.d==="Down"?j:0)-(d==="Down"?i:0);
  const score=valid(w,x,y,d);
  if(score>0)choices.push({x,y,d,score:score+random()/2});
 }
 choices.sort((a,b)=>b.score-a.score);
 if(!choices.length)return false;
 add(t,choices[0].x,choices[0].y,choices[0].d);
 return true;
}
const first=releasedChoices[0];
add(first,Math.floor((N-normalize(first[0]).length)/2),22,"Across");
usedReleased++;
// Fill the released quota first, then unreleased; never exceed the 30%
// unreleased ceiling just to fill a crossword with easy intersections.
for(const t of releasedChoices.slice(1)){
 if(usedReleased>=desiredReleased)break;
 if(placeCandidate(t))usedReleased++;
}
for(const t of unreleasedChoices){
 if(usedUnreleased>=desiredUnreleased)break;
 if(placeCandidate(t))usedUnreleased++;
}
// If an unreleased candidate cannot fit, substitute another released song.
// This keeps the released share at or above 70% instead of falling back to
// mostly unreleased words.
if(words.length<goal){
 for(const t of releasedChoices.slice(1)){
  if(words.length>=goal)break;
  if(words.some(p=>p.t[0]===t[0]))continue;
  if(placeCandidate(t))usedReleased++;
 }
}
const minX=Math.min(...words.map(p=>p.x))-1,maxX=Math.max(...words.map(p=>p.x+(p.d==="Across"?p.w.length-1:0)))+1,minY=Math.min(...words.map(p=>p.y))-1,maxY=Math.max(...words.map(p=>p.y+(p.d==="Down"?p.w.length-1:0)))+1;
const board=document.getElementById("board");const cols=maxX-minX+1,rows=maxY-minY+1;
function layout(){const avail=Math.max(200,(board.parentElement.clientWidth||360)-34);const cs=Math.max(22,Math.min(36,Math.floor(avail/cols)));board.style.gridTemplateColumns=`repeat(${cols},${cs}px)`;board.style.gridTemplateRows=`repeat(${rows},${cs}px)`;board.style.setProperty("--fs",Math.round(cs*.56)+"px")}
const starts=[...new Set(words.map(p=>p.y+","+p.x))].sort((a,b)=>{const [ay,ax]=a.split(",").map(Number),[by,bx]=b.split(",").map(Number);return ay-by||ax-bx});words.forEach(p=>p.n=starts.indexOf(p.y+","+p.x)+1);
const id=(x,y)=>x+","+y;let saved={};try{saved=JSON.parse(localStorage.getItem("ye-crossword-"+day)||"{}")}catch{}
const store=()=>{try{localStorage.setItem("ye-crossword-"+day,JSON.stringify(saved))}catch{}};
const cells=new Map();let selected=words[0],dir=selected.d,cur=null,wasCur=false,auto=false;
const nowEl=document.getElementById("now");
function contains(p,x,y){return p.d==="Across"?y===p.y&&x>=p.x&&x<p.x+p.w.length:x===p.x&&y>=p.y&&y<p.y+p.w.length}
const inp=(x,y)=>cells.get(id(x,y))?.querySelector("input");
const wordCells=p=>Array.from({length:p.w.length},(_,i)=>[p.x+(p.d==="Across"?i:0),p.y+(p.d==="Down"?i:0)]);
let hl=[];
function select(p){selected=p;dir=p.d;for(const el of hl)el.classList.remove("active","current");hl=[];wordCells(p).forEach(([x,y],i)=>{const el=cells.get(id(x,y));el.classList.add("active");if(i===0)el.classList.add("current");hl.push(el)});
 document.querySelectorAll(".clue").forEach(b=>{const on=Number(b.dataset.index)===words.indexOf(p);b.classList.toggle("active",on);if(on&&b.scrollIntoView&&!b.matches(":hover"))b.parentElement.scrollTop=Math.max(0,b.offsetTop-b.parentElement.offsetTop-40)});
 nowEl.textContent=p.n+" "+p.d+" — "+p.t[1]}
function selectAt(x,y,toggle){const ws=words.filter(p=>contains(p,x,y));if(!ws.length)return;let p=ws.find(w=>w.d===dir)||ws[0];if(toggle&&ws.length===2)p=ws.find(w=>w!==selected)||p;cur=id(x,y);select(p)}
function go(x,y){const el=inp(x,y);if(el){auto=true;el.focus();auto=false;try{el.select()}catch{}}}
function step(x,y,dx,dy){let nx=x+dx,ny=y+dy;while(nx>=minX&&nx<=maxX&&ny>=minY&&ny<=maxY){if(g[ny][nx])return[nx,ny];nx+=dx;ny+=dy}return null}
function put(x,y,ch){const el=inp(x,y);el.value=ch;saved[id(x,y)]=ch;store();el.parentElement.classList.remove("bad")}
function advance(x,y){const ws=wordCells(selected);const i=ws.findIndex(c=>c[0]===x&&c[1]===y);if(i>=0&&i+1<ws.length){go(...ws[i+1])}}
function retreat(x,y){const ws=wordCells(selected);const i=ws.findIndex(c=>c[0]===x&&c[1]===y);if(i>0)go(...ws[i-1])}
function jumpClue(delta){const i=(words.indexOf(selected)+delta+words.length)%words.length;const p=words[i];select(p);go(p.x,p.y);cur=id(p.x,p.y)}
for(let y=minY;y<=maxY;y++)for(let x=minX;x<=maxX;x++){const el=document.createElement("div");el.className="sq"+(g[y][x]?"":" empty");if(g[y][x]){const start=starts.indexOf(y+","+x);if(start>=0){const label=document.createElement("small");label.textContent=start+1;el.append(label)}
 const input=document.createElement("input");input.maxLength=1;input.autocomplete="off";input.autocapitalize="characters";input.spellcheck=false;input.setAttribute("enterkeyhint","next");input.value=saved[id(x,y)]||"";input.setAttribute("aria-label","Row "+(y-minY+1)+" column "+(x-minX+1));
 input.onmousedown=()=>{wasCur=cur===id(x,y)&&document.activeElement===input};
 input.onfocus=()=>{if(auto){cur=id(x,y);return}selectAt(x,y,false);try{input.select()}catch{}};
 input.onclick=()=>{if(wasCur)selectAt(x,y,true);wasCur=false;try{input.select()}catch{}};
 input.onkeydown=e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key;
  if(k.length===1&&/[a-z0-9]/i.test(k)){e.preventDefault();if(complete)return;put(x,y,k.toUpperCase());advance(x,y);return}
  if(k==="Backspace"||k==="Delete"){e.preventDefault();if(complete)return;if(input.value){put(x,y,"");input.parentElement.classList.remove("bad");saved[id(x,y)]="";store()}else if(k==="Backspace"){retreat(x,y);const c=document.activeElement;if(c&&c.tagName==="INPUT"){c.value="";}const p=wordCells(selected);const i=p.findIndex(q=>q[0]===x&&q[1]===y);if(i>0){const[px,py]=p[i-1];saved[id(px,py)]="";store()}}return}
  if(k===" "){e.preventDefault();selectAt(x,y,true);return}
  if(k==="Tab"||k==="Enter"){e.preventDefault();jumpClue(e.shiftKey?-1:1);return}
  const D={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[k];
  if(D){e.preventDefault();const axis=D[0]?"Across":"Down";if(axis!==dir){const ws=words.filter(p=>contains(p,x,y));const q=ws.find(w=>w.d===axis);if(q){select(q);return}}const n=step(x,y,D[0],D[1]);if(n){go(...n);const ws=words.filter(p=>contains(p,n[0],n[1]));if(!contains(selected,n[0],n[1])){select(ws.find(w=>w.d===dir)||ws[0])}}}};
 input.oninput=()=>{const v=normalize(input.value).slice(-1);input.value=v;saved[id(x,y)]=v;store();input.parentElement.classList.remove("bad");if(v)advance(x,y)};
 el.append(input)}cells.set(id(x,y),el);board.append(el)}
layout();
words.forEach((p,i)=>{const b=document.createElement("button");b.className="clue";b.dataset.index=i;b.textContent=p.n+" "+p.d+" — "+p.t[1];b.onclick=()=>{select(p);go(p.x,p.y);cur=id(p.x,p.y)};document.getElementById(p.d.toLowerCase()).append(b)});
document.getElementById("meta").textContent=day+" · "+words.length+" songs";select(selected);
const check=document.getElementById("check"),redeem=document.getElementById("redeem"),status=document.getElementById("status");
const ls=k=>{try{return localStorage.getItem(k)}catch{return null}};let complete=ls("ye-crossword-complete-"+day)==="true",claimed=ls("ye-crossword-redeemed-"+day)==="true";
function lockPuzzle(){for(const el of cells.values()){const inp=el.querySelector("input");if(inp)inp.readOnly=true}check.disabled=true;check.style.opacity=".5"}
function updateRewardUI(){redeem.style.display=complete?"inline-block":"none";if(complete)lockPuzzle();if(claimed){redeem.textContent="Already Redeemed!";status.textContent="🎉 Today's 100 YZYMNY reward has already been redeemed."}}
check.onclick=()=>{if(complete)return;const wrong=words.filter(p=>[...p.w].some((letter,i)=>saved[id(p.x+(p.d==="Across"?i:0),p.y+(p.d==="Down"?i:0))]!==letter));for(const [k,el] of cells){const i=el.querySelector("input");el.classList.remove("bad");if(!i||!i.value)continue;const [cx,cy]=k.split(",").map(Number);if(g[cy][cx]!==i.value)el.classList.add("bad")}if(wrong.length){status.textContent=wrong.length+" answers are incomplete or incorrect. Wrong letters are marked red.";return}complete=true;try{localStorage.setItem("ye-crossword-complete-"+day,"true")}catch{};status.textContent="🎉 Crossword complete! Redeem your 100 YZYMNY.";updateRewardUI()};
redeem.onclick=async()=>{if(claimed){status.textContent="Already Redeemed!";return}let client=window.parent?.supa;try{client=client||window.parent.eval("supa")}catch(e){}if(!client){status.textContent="Sign in to redeem your reward.";return}redeem.disabled=true;const {data,error}=await client.functions.invoke("claim-ye-crossword",{body:{day,answers:words.map(p=>[...p.w].map((_,i)=>saved[id(p.x+(p.d==="Across"?i:0),p.y+(p.d==="Down"?i:0))]||"").join(""))}});redeem.disabled=false;if(error||data?.error){const msg=data?.error||error?.message||"Reward claim failed";status.textContent=msg;if(msg.includes("Already Redeemed")){claimed=true;try{localStorage.setItem("ye-crossword-redeemed-"+day,"true")}catch{};updateRewardUI()}return}claimed=true;try{localStorage.setItem("ye-crossword-redeemed-"+day,"true")}catch{};updateRewardUI();status.textContent="🎉 +100 YZYMNY credited!";try{window.parent.eval("loadProfile()")}catch(e){}window.parent.postMessage({type:"ye-crossword-reward",balance:data.balance},"*")};
updateRewardUI();
(function(){let last=0;function post(){const h=Math.ceil(document.querySelector("main").getBoundingClientRect().height+24);if(Math.abs(h-last)<2)return;last=h;try{parent.postMessage({type:"ye-crossword-height",h},"*")}catch{}}
if(window.ResizeObserver){new ResizeObserver(()=>{layout();post()}).observe(document.querySelector("main"))}addEventListener("resize",()=>{layout();post()});post()})();
</script></html>
