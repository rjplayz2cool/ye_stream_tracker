// Duplicate-title releases: exact Spotify IDs always win over title matching.

if(id==='79mEFisvTUZcVGUxPM0dYc')return PROJECTS[2]; // DONDA 2 – 530

function openDetail(x){if(x.kind==='album'&&(!selected||selected.spotify!==x.spotify))albumTrackSortMode='tracklist';selected=x;let md=META[x.spotify]||{},m=nextM(x.streams);detail.innerHTML=`<div class="hero">${cover(x)}<div><h2>${esc(displayTitle(x))}</h2><div class="artists">${esc(artists(x))}</div></div></div><div class="detailGrid"><div class="box"><small>Current streams</small><b>${fmt(x.streams)}</b></div><div class="box"><small>Daily</small><b>${x.daily==null?'N/A':'+'+fmt(x.daily)}</b></div><div class="box"><small>Next milestone</small><b>${short(m)} · ${fmt(remaining(x))} left</b></div><div class="box"><small>Release date</small><b>${esc(md.releaseDate||'Unknown')}</b></div><div class="box"><small>Projected milestone</small><b>${estimate(x).replace(/<\/?b>/g,'')}</b></div><div class="box"><small>${x.kind==='album'?'Billboard 200 peak':'Billboard peak'}</small><b>${esc(md.billboardPeak||'Unknown')}</b></div></div><div class="chartTabs">${['7D','1M','3M','6M','1Y','ALL'].map(r=>`<button data-r="${r}" class="${r===range?'active':''}">${r==='ALL'?'All':r}</button>`).join('')}</div><div id="chart" class="chart"></div><div class="muted" style="font-size:12px;margin-top:8px">Charts use snapshots collected by this tracker. Longer ranges fill in automatically as daily history accumulates.</div>${x.kind==='album'?albumTrackList(x):''}<div class="detailActions"><a class="spotify" href="${esc(x.spotify)}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">Open exact Spotify page ↗</a><button class="downloadCard" id="downloadCard">Download card ↓</button></div>`;drawer.classList.add('open');shade.classList.add('open');document.getElementById('downloadCard').onclick=e=>{e.stopPropagation();downloadCardImage(x)};document.querySelectorAll('.chartTabs button').forEach(b=>b.onclick=()=>{range=b.dataset.r;openDetail(x)});document.querySelectorAll('[data-albumsort]').forEach(b=>b.onclick=()=>{albumTrackSortMode=b.dataset.albumsort;openDetail(x)});drawChart(x)}
function closeD(){drawer.classList.remove('open');shade.classList.remove('open')}const closeBtn=document.getElementById('close'),shadeEl=document.getElementById('shade');closeBtn.addEventListener('click',closeD);shadeEl.addEventListener('click',closeD);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeD()});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');kind=b.dataset.kind;render()});qel=document.querySelector('#q');qel.oninput=render;sort.onchange=render;updatedLabel.textContent=DB.updated;document.getElementById('songStat').textContent=DB.songs.length+' songs';document.getElementById('albumStat').textContent=DB.albums.length+' albums';buildThemes();const settingsBtn=document.getElementById('settingsBtn'),themePanel=document.getElementById('themePanel');settingsBtn.onclick=e=>{e.stopPropagation();themePanel.classList.toggle('open')};document.addEventListener('click',e=>{if(!e.target.closest('.settingsWrap'))themePanel.classList.remove('open')});render();
