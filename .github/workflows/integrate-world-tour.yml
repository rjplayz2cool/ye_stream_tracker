name: Integrate World Tour Tab
on:
  push:
    paths:
      - scripts/add_world_tour_tab.py
      - .github/workflows/integrate-world-tour.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Add World Tour navigation and screen
        run: python scripts/add_world_tour_tab.py
      - name: Commit updated homepage
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Integrate World Tour tab into Ye Tracker homepage"
            git push
          fi
