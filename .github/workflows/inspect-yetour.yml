name: Inspect yetour
on:
  push:
    paths:
      - '.github/workflows/inspect-yetour.yml'
      - 'updates/inspect_yetour.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 updates/inspect_yetour.py
        continue-on-error: true
      - name: Save report
        if: always()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          mkdir -p recovery-index
          ls -la recovery-index | head
          git add -f recovery-index/yetour-inspection.json || true
          git commit -m "Inspect yetour" || true
          for i in 1 2 3 4; do git pull --rebase --autostash && git push && break; sleep 5; done
