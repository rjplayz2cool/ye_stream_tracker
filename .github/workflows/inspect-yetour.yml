name: Inspect yetour
on:
  push:
    paths:
      - '.github/workflows/inspect-yetour.yml'
      - 'updates/inspect_yetour.py'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright && playwright install --with-deps chromium
      - run: python3 updates/inspect_yetour.py
      - name: Save report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-index/yetour-inspection.json
          git diff --cached --quiet || (git commit -m "Inspect yetour" && git pull --rebase && git push)
