name: Patch World Tour background
on:
  push:
    paths:
      - '.github/workflows/patch-tour-background.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply background fix
        run: python3 updates/fix_tour_background.py
      - name: Commit corrected main page
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Cover World Tour bottom theme strip" && git pull --rebase && git push)
