name: Inspect site sections
on:
  push:
    paths:
      - '.github/workflows/inspect-sections.yml'
      - 'recovery-index/inspect-trigger.txt'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect code excerpts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          terms=['LET GO V16','calendarEvents','calendarData','calendarHistory','worldTour','2026-10-16','Heartless','onThisDay','calendarItems','tourFrame']
          lines=['total characters: '+str(len(s))]
          for term in terms:
              start=0
              for n in range(5):
                  pos=s.lower().find(term.lower(),start)
                  if pos<0:break
                  lines.append('TERM '+term+' OFFSET '+str(pos))
                  lines.append(s[max(0,pos-450):pos+900])
                  start=pos+len(term)
          Path('recovery-index/inspection.txt').write_text('\n'.join(lines)[:80000])
          PY
      - name: Save excerpts
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-index/inspection.txt
          git diff --cached --quiet || (git commit -m "Inspect website source" && git push)
