name: Import Tracker Audio Copies
on:
  workflow_dispatch:
    inputs:
      names:
        description: 'Optional exact song/version titles. Leave empty to import the selected sections.'
        default: ''
        required: false
        type: string
      count:
        description: 'Maximum new audio files; 0 imports all selected links until the storage limit'
        default: '0'
        required: true
        type: string
      sections:
        description: 'Tracker sections separated by commas'
        default: 'Worst Of,Best Of,Special,Grails/Wanted'
        required: true
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ye-tracker-audio-import
  cancel-in-progress: false
jobs:
  import-and-publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Copy selected audio files
        env:
          IMPORT_NAMES: ${{ inputs.names }}
          IMPORT_COUNT: ${{ inputs.count }}
          IMPORT_SECTIONS: ${{ inputs.sections }}
        run: python scripts/import_imgur_audio.py --names "$IMPORT_NAMES" --sections "$IMPORT_SECTIONS" --limit "$IMPORT_COUNT" --max-file-mb 95 --max-total-mb 700 --repair-existing
      - name: Commit actual files and player mappings
        if: always()
        run: |
          git add media/imgur data/hosted-audio.json data/audio-import-report.json
          if git diff --cached --quiet; then
            echo "No new audio copies."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Add copied tracker audio and playable card mappings"
            git pull --rebase
            git push
          fi
      - name: Summarize import
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p=Path('data/audio-import-report.json')
          if p.exists():
              d=json.loads(p.read_text())
              print('## Selected tracker audio import')
              print('Sections: Worst Of, Best Of, Special, Grails/Wanted')
              for label,key in [('Selected unique links','selectedUniqueLinks'),('New copies','imported'),('Total available copies','availableCopies'),('Links without copies','remainingCount')]:
                  print(f'- {label}: {d.get(key, "—")}')
              if d.get('blocked'): print('\nImport paused: '+d['blocked'])
              print('\nSee `data/audio-import-report.json` for skipped files and remaining links.')
          PY
      - uses: actions/configure-pages@v5
        if: always()
      - uses: actions/upload-pages-artifact@v4
        if: always()
        with:
          path: '.'
          retention-days: 1
      - id: deployment
        if: always()
        uses: actions/deploy-pages@v4
