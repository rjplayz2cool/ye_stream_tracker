name: Publish late October calendar entries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-late-october.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize BBP artwork for browsers
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageFile
          from pathlib import Path
          ImageFile.LOAD_TRUNCATED_IMAGES=True
          source=Path('assets/calendar/bbp-2026.jpg')
          target=Path('assets/calendar/bbp-calendar.png')
          if not source.is_file():raise SystemExit('BBP source missing')
          with Image.open(source) as im:
            print('BBP source',im.format,im.size)
            im.convert('RGB').save(target,format='PNG')
          with Image.open(target) as im:
            im.verify()
          print('Verified normalized BBP image',target)
          PY
      - name: Update calendar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          p=Path('index.html')
          s=p.read_text()
          events=[
          (19,2024,'PAPERWORK V2','YEBU'),
          (19,2024,'TAKE OFF YOUR DRESS V2','BBP'),
          (19,2024,'DEAD V4','V1'),
          (19,2024,'BELIEVER V14','V2'),
          (20,2024,'EVERYBODY V1','YEBU'),
          (20,2024,'SEROTONIN V1','BULLY'),
          (21,2025,'DRUNK V11','V1'),
          (22,2020,'Cops Shot The Kid','LOVE'),
          (23,2020,'Pressure','SWISH'),
          (25,2001,'KEN D$L','BEFORE'),
          (29,2024,'FEAR V5','V2'),
          (31,2024,'THIRSTY V4','V2')]
          titles=[
          '"PAPERWORK V2" Leaked',
          '"TAKE OFF YOUR DRESS V2" Snippet Leaked',
          '"DEAD V4" Snippet Leaked',
          '"BELIEVER V14" Snippet Leaked',
          '"EVERYBODY V1" Snippet Leaked',
          'Ye Posts "SEROTONIN V1" Snippet To Instagram Story',
          'Ty Plays "DRUNK V11" To Auger On Stream',
          'Che Pope Plays "Cops Shot The Kid (feat. Andre 3000)" On Instagram Stream',
          'Che Pope Live Stream Where "Pressure (ft. Travis Scott)" Was Played Surfaced',
          'KEN D$L Demo Album Produced By Ye Registered To Library Of Congress',
          '"FEAR V5" Snippet Leaked',
          '"THIRSTY V4" Snippet Leaked']
          imagefiles=[f for f in Path('.').rglob('*') if f.suffix.lower() in ('.jpg','.png','.jpeg','.webp')]
          hints={'YEBU':['yebu','thank-god-for-drugs','thank_god_for_drugs'],'BBP':['bbp','bad-bitch-playbook','bad_bitch_playbook'],'V1':['vultures-1','vultures1','vultures_1','vultures 1'],'V2':['vultures-2','vultures2','vultures_2','vultures 2'],'BULLY':['bully'],'LOVE':['love-everyone','love_everyone','loveeveryone'],'SWISH':['swish'],'BEFORE':['before-the-college-dropout','before_the_college_dropout','before the college dropout','before']}
          covers={}
          for k,patterns in hints.items():
            matches=[str(f) for h in patterns for f in imagefiles if h in str(f).lower()]
            if not matches:
              raise SystemExit('Missing '+k+' cover; refusing partial update')
            matches=sorted(set(matches),key=lambda x:(0 if x.startswith('assets/calendar/') else 1,len(x)))
            covers[k]=matches[0]
            print('COVER',k,covers[k],flush=True)
          # The YEBU artwork is an uploaded calendar asset, not an album filename.
          yebu=Path('assets/calendar/yebu.jpg')
          if not yebu.is_file():raise SystemExit('Missing assets/calendar/yebu.jpg')
          covers['YEBU']=str(yebu)
          bbp=Path('assets/calendar/bbp-2026.jpg')
          fixed_bbp=Path('assets/calendar/bbp-calendar.png')
          if not fixed_bbp.is_file():raise SystemExit('Normalized BBP image missing')
          covers['BBP']=str(fixed_bbp)
          print('FINAL COVER MAPPING',covers,flush=True)
          marker='const CALENDAR_ANNUAL_EVENTS=['
          if marker not in s:raise SystemExit('Missing calendar array')
          added=[]
          for (day,year,_,key),title in zip(events,titles):
            if title not in s:added.append(json.dumps(dict(month=10,day=day,title=title,releaseYear=year,cover=covers[key],event=True))+',')
          if added:s=s.replace(marker,marker+'\n'+'\n'.join(added),1)
          # Repair the cover on the already-published October 19 entry.
          title='"TAKE OFF YOUR DRESS V2" Snippet Leaked'
          pat=r'\{[^{}]*"title"\s*:\s*'+re.escape(json.dumps(title))+r'[^{}]*\}'
          def repair(m):
            entry=m.group(0)
            if '"cover"' not in entry:raise SystemExit('Missing cover property on TAKE OFF YOUR DRESS event')
            return re.sub(r'("cover"\s*:\s*)"[^"]*"',lambda c:c.group(1)+json.dumps(covers['BBP']),entry,count=1)
          s,count=re.subn(pat,repair,s)
          if count<1:raise SystemExit('TAKE OFF YOUR DRESS calendar entry not found')
          print('Repaired artwork on',count,'matching calendar entries',flush=True)
          p.write_text(s)
          print('Added',len(added),'calendar events')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/calendar/bbp-calendar.png
          if git diff --cached --quiet; then
            echo "No new calendar entries to commit"
            exit 0
          fi
          git commit -m "Add late October calendar dates"
          # Other workflows may update main simultaneously. Rebase and retry.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then
              echo "Calendar update published"
              exit 0
            fi
            echo "Concurrent update; retrying ($attempt/5)"
            sleep 4
          done
          echo "Unable to publish after five retries"
          exit 1
