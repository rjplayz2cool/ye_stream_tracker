name: Inspect crossword logic
on:
  push:
    paths:
      - '.github/workflows/inspect-crossword.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract crossword logic
        run: python3 updates/inspect_crossword.py
      - name: Save report
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add recovery-index/crossword-inspection.txt
          git diff --cached --quiet || (git commit -m "Inspect crossword generator" && git pull --rebase && git push)
