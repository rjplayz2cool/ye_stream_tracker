name: Add October 18 calendar entries
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/oct18.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert calendar entries
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('index.html')
          s=p.read_text()
          entries=[
            (2021,'Ye Legally Changes His Name To Ye','assets/calendar/oct18-name-change.jpg'),
            (2024,'"BEAUTY AND THE BEAST" Released On Apple Music','covers/bully.jpg'),
            (2024,"Tyler, The Creator Names Ye Chromakopia's Executive Producer",'assets/calendar/oct18-tyler.jpg'),
            (2019,'Ye Brings Sunday Service To Jamaica','covers/jesus-is-king.jpg'),
            (2009,'"We Were Once A Fairytale" Short Film Leaked','assets/calendar/oct18-fairytale.jpg'),
            (2011,'Chris Brown Releases Paris Freestyle','covers/watch-the-throne.jpg')
          ]
          marker='const CALENDAR_ANNUAL_EVENTS=['
          if marker not in s:raise SystemExit('Missing calendar array')
          added=[]
          for year,title,cover in entries:
            if title not in s:
              added.append(json.dumps(dict(month=10,day=18,title=title,releaseYear=year,cover=cover,event=True),ensure_ascii=False)+',')
          if added:
            s=s.replace(marker,marker+'\n'+'\n'.join(added),1)
            p.write_text(s)
          print('Added',len(added),'events')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Add October 18 anniversaries" && git pull --rebase && git push)
