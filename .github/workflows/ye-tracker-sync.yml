name: Sync Ye Tracker
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: ye-tracker-sync-and-pages
  cancel-in-progress: false
jobs:
  sync-and-publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install 'lxml>=5,<7'
      - name: Refresh tracker
        run: python scripts/sync_ye_tracker.py
      - name: Commit updated tracker
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh Ye Tracker data"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Configure Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - name: Upload site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
          retention-days: 1
      - name: Publish site
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
